[package]
name = "nuraloumi-shell"
autobins = false
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cairo-rs = { version = "0.20", default-features = false, features = ["png"] }
nuraloumi-core = { path = "../nuraloumi-core" }
nuraloumi-render-cairo = { path = "../nuraloumi-render-cairo" }
nuraloumi-wayland = { path = "../nuraloumi-wayland" }
nuraloumi-providers = { path = "../nuraloumi-providers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
png = { version = "0.17", default-features = false }
jpeg-decoder = { version = "0.3", default-features = false }
libc = "0.2"

[dev-dependencies]
jpeg-encoder = { version = "0.6", default-features = false }

[[bin]]
name = "nuraloumi-viewer"
path = "src/bin/viewer.rs"

[[bin]]
name = "nuraloumi-ctl"
path = "src/bin/ctl.rs"

[[bin]]
name = "nuraloumi-resources"
path = "src/bin/resources.rs"

[[bin]]
name = "nuraloumi-tasks"
path = "src/bin/tasks.rs"

[[bin]]
name = "nuraloumi-music"
path = "src/bin/music.rs"

[[bin]]
name = "nuraloumi-notifications"
path = "src/bin/notifications.rs"

[[bin]]
name = "nuraloumi-terminal"
path = "src/bin/terminal.rs"

[[bin]]
name = "nuraloumi-editor"
path = "src/bin/editor.rs"

[[bin]]
name = "nuraloumi-clipboard"
path = "src/bin/clipboard.rs"

[[bin]]
name = "nuraloumi-screenshot"
path = "src/bin/screenshot.rs"

[[bin]]
name = "nuraloumi-toast"
path = "src/bin/toast.rs"

[[bin]]
name = "nuraloumi-calendar"
path = "src/bin/calendar.rs"

[[bin]]
name = "nuraloumi-menu"
path = "src/bin/menu.rs"

[[bin]]
name = "nuraloumi-panel"
path = "src/bin/panel.rs"

[[bin]]
name = "nuraloumi-run"
path = "src/bin/run.rs"

[[bin]]
name = "nuraloumi-files"
path = "src/bin/files.rs"

[[bin]]
name = "nuraloumi-windows"
path = "src/bin/windows.rs"

[[bin]]
