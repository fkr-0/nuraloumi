# Versioned NuraLoumi example (legacy files may omit config_version).
config_version = 1
panel_edge = "top"
panel_height = 48
menu_width = 448
row_height = 48
theme = "dark"
palette = "slate_dark" # slate_dark | paper_light | high_contrast
launcher_fullscreen = false
reduced_motion = false

[panel]
[[panel.quick_launch]]
label = "Term"
glyph = ""
command = "nuraloumi-terminal"

[[panel.quick_launch]]
label = "Edit"
glyph = ""
command = "nuraloumi-editor"

[[panel.quick_launch]]
label = "Files"
desktop = "org.gnome.Nautilus.desktop"

[surface.music]
show_album_art = false

[surface.resources]
refresh_interval_ms = 5000

[surface.calendar]
ical_path = "~/.local/share/khal/calendars"

[providers]
terminal = "foot"
editor = "nvim"
weather_url = "https://wttr.in/?format=j1"
weather_cache_seconds = 1800

[providers.media]
backend = "playerctl"

[providers.resources]
refresh_interval_ms = 5000
top_process_count = 10

[menu_dismissal]
outside_press = true
after_one_shot_action = true

[keybindings]
enabled = true

[[keybindings.bindings]]
id = "user.audio-up"
keys = "Ctrl+Alt+Up"
scope = "global"
action = { id = "audio.adjust", delta = 5 }

[launcher]
pinned = ["foot.desktop", "firefox.desktop"]
hidden = ["org.example.LegacyTool.desktop"]

[launcher.labels]
"foot.desktop" = "Terminal"
"firefox.desktop" = "Web"

[launcher.app_id_aliases]
"firefox.desktop" = ["firefox", "firefox-esr"]
