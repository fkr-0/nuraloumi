schema: infra-change-packet/v1
schema_version: 1
change:
  service: NuraLoumi 0.0.8-rc.2 regular browser integration
  host: owner-designated SL101 tablet (private network identity withheld)
  risk: migration
  requested_scope:
    - integrate Mesa 26.2.4 plus LLVM 23 VFPv3-D16 correction
    - qualify WPE 2.54.2 navigation and visible Wayland pages
    - qualify WayVNC pointer/touch and NuraPlayer isolation
    - deploy the CI-verified production NuraLoumi release after all gates pass
ownership:
  state: known-gap
  canonical_source: NuraLoumi upstream main
  external_dependencies:
    - privately reviewed SL101 Mesa D16 patchset
    - Alpine armv7/musl WebKit 2.54.2 complete installed-layout runtime
    - Sway/WayVNC user session and existing Pixman recovery path
    - owner-directed upstream main CI release and SHA-verified artifact
  blockers:
    - no source-matched, qualified regular NuraBrowser runtime.json and closure manifest
    - WPE producer workflow explicitly emits UNQUALIFIED candidate; regular CI release requires missing pinned runtime
    - the legacy local main worktree at 7e180747 is divergent and contains nine uncommitted edits; it must be preserved until an explicitly reviewed reconciliation
    - Cargo.toml now reports 0.0.8-rc.2 and the host source tests pass, but the exact-source WPE runtime and production package are not qualified
    - no verified production artifact or prepared versioned rollback snapshot for new install
    - real semantic touch and full WayVNC navigation input not yet qualified
preflight:
