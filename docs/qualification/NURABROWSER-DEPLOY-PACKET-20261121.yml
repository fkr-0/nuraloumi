schema: infra-change-packet/v1
schema_version: 1
change:
  service: SL101 NuraLoumi browser plus player regression
  host: owner-designated SL101 target (device alias and network identity omitted)
  risk: migration
  requested_scope:
    - qualified ARMv7/musl regular browser bundle installation
    - new NuraLoumi browser/player smoke testing
ownership:
  state: known-gap
  canonical_source: NuraLoumi package and scripts
  external_dependencies:
    - postmarketOS Alpine armv7/musl
    - Sway/Wayland
    - WPE WebKit 2.54+
    - sandboxed WebProcess and helpers
  blockers:
    - no qualified runtime.json or nurabrowser-core artifact
    - no official CI package artifact
    - prior binaries are not yet owned by the expected package
preflight:
  inventory:
    - target identity and current system state are held in the private operator record
    - installed browser/player binary hashes are held in the private operator record
    - regular browser runtime: missing
  local_checks:
    - exact manifest plus source and producer SHA verification
    - ARMv7 no-NEON/no-hardware-division and musl ELF closure
    - sandbox helper and compiled-in WebProcess paths under installed prefix
    - official CI artifact and final APK/tar package-check
  preview_commands:
    - package-check on a staged, verified release artifact (not yet available)
  expected_changes:
    - one versioned, rollback-capable NuraLoumi package installation
rollback:
  required: true
  artifact: null
  restore_steps:
    - record and preserve bytes, modes and hashes of current browser/player
    - preserve existing Wayland session and compositor ownership
    - restore exact prior binaries and service state if any postflight gate fails
  triggers:
    - SIGILL or loader failure
    - missing sandboxed WebProcess
    - no visible page pixels or failed tab/navigation/touch
    - NuraPlayer regression
apply:
  authorized: true
  command: null
  limit: owner-designated SL101 only
  allowed_roles:
    - qualified release artifact deployment
postflight:
  probes:
    - actual WPE-rendered page pixels and responsive navigation/tabs
    - touch and physical keyboard input
    - sandbox and same-UID IPC
    - NuraPlayer audio/video and software-recovery path
  idempotency_command: package version and installed SHA consistency
results:
  commands:
    - read-only target identity, system and installed-binary integrity checks
  changed_resources: []
  warnings:
    - Apply was not attempted because mandatory release gates failed.
    - Rollback artifact must be made immediately before any future install.
  rollback_performed: false
