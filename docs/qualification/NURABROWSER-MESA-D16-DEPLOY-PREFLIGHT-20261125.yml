    - "target: ARMv7l SL101; hostname and kernel identity recorded in private preflight"
    - "boot_id: verified privately; omitted from public source"
    - "eMMC and SD card CIDs: matched private device inventory; omitted from public source"
    - "battery: 99 percent, AC online: 1"
    - "root storage: 89.3G available at preflight"
    - "current release: previously installed versioned NuraLoumi release; exact private path recorded separately"
    - "installed libgallium-26.2.4.so SHA256: 17acc83789f834278f4fd939a79c627dfe2054bedee353733c57029861af6619"
    - "patched private libgallium SHA256: 09e03bea18be4120a6d22dde9887e4a452dcd488df6933c5cf46a4c15ec8e87b"
    - "live compositor and WayVNC processes: verified in private preflight"
    - "regular /usr/libexec/nuraloumi/browser runtime: absent"
  local_checks:
    - "SL101 ISA and pixel/IPC tests: 19 focused tests passed"
    - "NuraLoumi browser qualification and runtime contract tests: 29 passed"
    - "headless sandboxed WPE 2.54.2: two prior passes; JIT decoded with zero forbidden instructions"
    - "nested Sway/Pixman with patched Mesa and softpipe: actual index and next-page screenshot oracles PASS"
    - "live WayVNC through SSH RFB: first-page pixel capture PASS, server and compositor survived"
    - "WayVNC pointer click: attempted but navigation unproven"
  preview_commands:
    - "python3 scripts/verify-ci-artifact.py --lane alpine --run-id <success-run> --sha <reviewed-git-sha> --out <new-staging>"
    - "python3 scripts/qualify-nurabrowser-release.py --archive <verified-archive> --archive-sha256 <sha> --manifest <verified-manifest> --source-sha <sha> --extracted-root <staged-root>"
    - "versioned release dry-run with exact .106 identity, current link, content checksums and restored rollback"
  expected_changes:
    - one verified versioned NuraLoumi release under /opt/nuraloumi/releases
    - atomic update of /opt/nuraloumi/current only after package and device qualification
    - preserve system Mesa, Grate, kernel, active compositor, WayVNC and independent Pixman fallback
rollback:
  required: true
  artifact: null
  restore_steps:
    - preserve SHA256 and bytes/mode of all existing browser and player binaries before apply
    - preserve current release symlink and the previously known-good release directory
    - stop only scoped trial-owned browser/UIProcess children
    - atomically restore the exact previous /opt/nuraloumi/current symlink if activation fails
    - check original Sway, WayVNC, launcher, NuraPlayer and Pixman recovery desktop
  triggers:
    - any SIGILL, SIGSEGV, sandbox escape or loader mismatch
    - missing compiled-in WebProcess/helper path or incomplete dlopen closure
    - incorrect pixels, failed input/gesture or absent real touch semantics
    - NuraPlayer or independent software renderer regression
apply:
  authorized: true
  command: null
  limit: owner-designated SL101 only; verify device identity against private preflight
  allowed_roles:
    - exact reviewed official ARMv7/musl CI release after preflight closure
postflight:
  probes:
    - check exact device identity, eMMC/SD CIDs, kernel and boot ID again
    - check versioned binary SHA256, ELF interpreter, D16 ISA and WebProcess sandbox
    - compare real page pixel oracles and navigation/back/forward/refresh/tabs
    - real touchscreen wl_touch trace, keyboard focus and WayVNC pointer navigation
    - NuraPlayer media and software wl_shm/Pixman recovery
    - confirm previous release remains independently bootable
  idempotency_command: inspect /opt/nuraloumi/current plus sha256sum of exact installed files and package manifest
results:
