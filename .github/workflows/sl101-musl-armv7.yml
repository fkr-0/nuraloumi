name: SL101 Alpine armv7 musl package

on:
  workflow_dispatch:
    inputs:
      gpu_producer_run_id:
        description: 'Optional exact sl101_linux producer workflow run ID (blank = software only)'
        required: false
        type: string
      gpu_producer_revision:
        description: 'Full 40-character sl101_linux source commit (required for GPU)'
        required: false
        type: string
      gpu_archive_sha256:
        description: 'Full SHA256 of producer video-bundle.tar.gz (required for GPU)'
        required: false
        type: string
      browser_producer_run_id:
        description: 'Exact GitHub Actions run ID that produced the qualified WPE musl runtime for this same commit'
        required: false
        type: string
      browser_runtime_manifest_sha256:
        description: 'SHA256 of runtime.json from the qualified same-commit WPE producer artifact'
        required: false
        type: string
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    paths:
      - .github/workflows/sl101-musl-armv7.yml
      - .cargo/**
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - components/nura-browser-engine/**
      - packaging/**
      - scripts/prepare-ci-musl-sysroot.sh
      - scripts/build-sl101-armv7.sh
      - scripts/armv7-sl101-linker.sh
      - scripts/inspect-armv7-elf.sh
      - scripts/package-binaries.py
      - scripts/build-ci-alpine-apk.sh
      - scripts/test_native_packages_ci.py
      - scripts/verify_nurabrowser_runtime.py
      - scripts/test_verify_nurabrowser_runtime.py
      - scripts/audit_nurabrowser_wpe_candidate.py
      - scripts/test_audit_nurabrowser_wpe_candidate.py
      - scripts/verify-ci-artifact.py
      - scripts/test_verify_ci_artifact.py
      - packaging/alpine/**
      - scripts/test_musl_ci.py
      - scripts/verify_sl101_video_bundle.py
      - scripts/test_verify_sl101_video_bundle.py

permissions:
  contents: read

jobs:
  alpine-armv7-musl:
    name: Alpine armv7 hard-float musl, VFPv3-D16, no NEON
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TARGET: armv7-unknown-linux-musleabihf
      NURALOUMI_SL101_CROSS_ROOT: ${{ github.workspace }}/target/sl101-cross-ci
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install host tools for cross compilation and audit
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang lld llvm pkg-config binutils file python3
          docker --version
          clang --version
          llvm-objdump --version | head -n 2

      - name: Enable native armv7 package install through QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf
          components: rust-src

      - name: Validate CI contract and build target
        shell: bash
        run: |
          set -euo pipefail
          rustup target list --installed | grep -Fx "$TARGET"
          rustup component list --installed | grep -Fx 'rust-src'
          python3 -m unittest scripts/test_musl_ci.py -v
          python3 -m unittest scripts/test_native_packages_ci.py -v
          python3 -m unittest scripts/test_verify_ci_artifact.py -v
          python3 -m unittest scripts/test_verify_nurabrowser_runtime.py -v
          python3 -m unittest scripts/test_audit_nurabrowser_wpe_candidate.py -v
          python3 -m unittest scripts/test_verify_sl101_video_bundle.py -v
          python3 -m unittest scripts/test_verify_packaged_sl101_video.py -v

      - name: Prepare signed Alpine armv7 sysroot (never accesses tablet)
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/prepare-ci-musl-sysroot.sh
          cat "$NURALOUMI_SL101_CROSS_ROOT/source.txt"

      - name: Build and audit all ARMv7/musl release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/gha-artifact
          sh scripts/build-sl101-armv7.sh | tee target/gha-artifact/BUILD-LOG.txt
          grep -F 'SL101_CROSS_BUILD=PASS' target/gha-artifact/BUILD-LOG.txt
          python3 scripts/package-binaries.py > target/gha-artifact/BINARY-LIST.txt
          test "$(wc -l < target/gha-artifact/BINARY-LIST.txt)" -ge 4

      - name: Validate qualified same-commit WPE producer selection
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER_PRODUCER_RUN: ${{ inputs.browser_producer_run_id }}
          BROWSER_MANIFEST_SHA: ${{ inputs.browser_runtime_manifest_sha256 }}
        run: |
          set -euo pipefail
          [[ "$BROWSER_PRODUCER_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$BROWSER_MANIFEST_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$BROWSER_PRODUCER_RUN" |
            python3 -c '
          import json, sys
          run = json.load(sys.stdin)
          expected_sha = sys.argv[1]
          assert run.get("path") == ".github/workflows/nurabrowser-wpe-musl-producer.yml"
          assert run.get("event") == "workflow_dispatch"
          assert run.get("status") == "completed" and run.get("conclusion") == "success"
          assert run.get("head_sha") == expected_sha
          ' "$GITHUB_SHA"

      - name: Download exact qualified same-commit WPE runtime
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/download-artifact@v4
        with:
          name: nurabrowser-wpe-musl-qualified-${{ github.sha }}
          run-id: ${{ inputs.browser_producer_run_id }}
          github-token: ${{ github.token }}
          path: target/browser-producer-download

      - name: Verify WPE runtime manifest, exact source and ELF closure
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          BROWSER_MANIFEST_SHA: ${{ inputs.browser_runtime_manifest_sha256 }}
        run: |
          set -euo pipefail
          test -s target/browser-producer-download/runtime.json
          printf '%s  %s\n' "$BROWSER_MANIFEST_SHA" target/browser-producer-download/runtime.json | sha256sum --check --status
          python3 scripts/verify_nurabrowser_runtime.py target/browser-producer-download \
            --source-sha "$GITHUB_SHA" \
            --target "$TARGET" \
            --producer-revision "$GITHUB_SHA"

      - name: Package the exact committed build
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          NURALOUMI_BROWSER_RUNTIME_DIR: ${{ github.workspace }}/target/browser-producer-download
          NURALOUMI_BROWSER_PRODUCER_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Ordinary packages now require the fully qualified native WPE
          # runtime. The old Debian/glibc engine smoke tar is never accepted.
          # Until a same-source ARMv7/musl producer exists, fail this release
          # job rather than upload a browser launcher advertised as complete.
          test -n "${NURALOUMI_BROWSER_RUNTIME_DIR:-}" || {
            echo 'FAIL: mandatory musl NuraBrowser runtime producer is unavailable' >&2
            exit 1
          }
          test -n "${NURALOUMI_BROWSER_PRODUCER_REVISION:-}" || {
            echo 'FAIL: missing pinned NuraBrowser producer revision' >&2
            exit 1
          }
          # Ensure xtask Git subprocesses resolve the CI checkout when
          # a compiler embeds an alternate CARGO_MANIFEST_DIR mount prefix.
          export GIT_DIR="$PWD/.git"
          export GIT_WORK_TREE="$PWD"
          test -d "$GIT_DIR"
          git rev-parse --verify HEAD
          test -z "$(git status --porcelain)"
          cargo xtask package --target "$TARGET" --out target/gha-artifact/nuraloumi-ci
          cargo xtask package-check --dir target/gha-artifact/nuraloumi-ci
          test -s target/gha-artifact/nuraloumi-ci.tar
          test -s target/gha-artifact/nuraloumi-ci/MANIFEST.txt
          grep -Fx "target=$TARGET" target/gha-artifact/nuraloumi-ci/MANIFEST.txt
          grep -Fx 'git_dirty=false' target/gha-artifact/nuraloumi-ci/MANIFEST.txt
          printf 'git_sha=%s\n' "$(git rev-parse HEAD)" > target/gha-artifact/BUILD-INFO.txt
          rustc -vV >> target/gha-artifact/BUILD-INFO.txt
          cat "$NURALOUMI_SL101_CROSS_ROOT/source.txt" >> target/gha-artifact/BUILD-INFO.txt

      - name: Fail closed on wrong ELF, musl ABI or missing surface binaries
        shell: bash
        run: |
          set -euo pipefail
          audit=target/gha-artifact/ELF-AUDIT.txt
          : > "$audit"
          while IFS= read -r name; do
            bin="target/$TARGET/release/$name"
            test -x "$bin"
            file "$bin" | tee -a "$audit"
            readelf -h "$bin" | grep -Eq 'Class:[[:space:]]+ELF32'
            readelf -h "$bin" | grep -Eq 'Machine:[[:space:]]+ARM'
            readelf -h "$bin" | grep -Fq 'hard-float ABI'
            readelf -A "$bin" | grep -Fq 'Tag_ABI_VFP_args: VFP registers'
            readelf -A "$bin" | grep -Eq 'Tag_FP_arch: VFPv3-D16'
            if readelf -A "$bin" | grep -Eiq 'Advanced_SIMD|NEON'; then
              echo "FAIL: NEON attributes in $bin" >&2
              exit 1
            fi
            # Check decoded ARM/Thumb instructions, not just ELF attributes.
            # The shared helper guards D16-D31, NEON and sdiv/udiv.
            sh scripts/inspect-armv7-elf.sh "$bin" | tee -a "$audit"
            # Also reject sized vector opcodes (e.g. vld1.32) explicitly.
            # Do not use grep -q with pipefail: early close can mask a match.
            if llvm-objdump -d "$bin" | grep -Ei '[[:space:]](vld[1-4]|vst[1-4]|vdup|vext|vtbl|vtbx|vzip|vuzp|vtrn|vrev|vswp|vq[a-z0-9.]+)(\.[a-z0-9.]+)?[[:space:]]' >/dev/null; then
              echo "FAIL: NEON opcode in $bin" >&2
              exit 1
            fi
            readelf -l "$bin" | grep -Fq '/lib/ld-musl-armhf.so.1'
            readelf -d "$bin" | grep -Fq '[libc.musl-armv7.so.1]'
            if readelf -d "$bin" | grep -Eq 'libc.so.6|RPATH|RUNPATH'; then
              echo "FAIL: glibc dependency or embedded dynamic path in $bin" >&2
              exit 1
            fi
            # The APKBUILD uses explicit deps (!tracedeps) so new direct ELF
            # dependencies cannot silently enter a signed installable package.
            while IFS= read -r soname; do
              case "$soname" in
                libc.musl-armv7.so.1|libcairo.so.2|libgcc_s.so.1|libxkbcommon.so.0) ;;
                *) echo "FAIL: unmapped Alpine runtime dependency $soname in $bin" >&2; exit 1 ;;
              esac
            done < <(readelf -d "$bin" | sed -n 's/.*Shared library: \[\([^]]*\)\].*/\1/p')
            printf 'PASS %s ELF32 ARM VFPv3-D16 hardfloat musl no-NEON-attributes\n' "$name" | tee -a "$audit"
          done < target/gha-artifact/BINARY-LIST.txt
          count=$(grep -c '^PASS ' "$audit")
          test "$count" -eq "$(wc -l < target/gha-artifact/BINARY-LIST.txt)"
          if test -s target/gha-artifact/nuraloumi-ci.tar; then
            (cd target/gha-artifact && sha256sum nuraloumi-ci.tar > SHA256SUMS.txt)
          fi
          echo 'ELF_AUDIT=PASS heuristic-only; physical SL101 no-SIGILL remains pending'

      - name: Stage actual ARMv7/musl ELF bytes for independent audit only
        if: ${{ github.event_name != 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          stage=target/gha-artifact/armv7-musl-elf
          mkdir -p "$stage"
          while IFS= read -r name; do
            case "$name" in
              nuraloumi-*) ;;
              *) echo "FAIL: unexpected binary name in audit inventory: $name" >&2; exit 1 ;;
            esac
            test -x "target/$TARGET/release/$name"
            cp -- "target/$TARGET/release/$name" "$stage/$name"
          done < target/gha-artifact/BINARY-LIST.txt
          test "$(find "$stage" -maxdepth 1 -type f | wc -l)" -eq \
            "$(wc -l < target/gha-artifact/BINARY-LIST.txt)"
          (
            cd target/gha-artifact
            sha256sum armv7-musl-elf/* > ARMV7-ELF-SHA256SUMS.txt
            sha256sum --check --status ARMV7-ELF-SHA256SUMS.txt
          )
          printf 'source_sha=%s\ntarget=%s\nruntime_qualification=UNQUALIFIED\ncontains_wpe=false\ncontains_gpu_video_bundle=false\ndeployment=FORBIDDEN\n' \
            "$GITHUB_SHA" "$TARGET" > target/gha-artifact/AUDIT-ONLY-NO-DEPLOYMENT.txt

      - name: Sign an Alpine armv7 development .apk from these audited binaries
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          # A development artifact is never an authorized production deployment.
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD:/work:ro" \
            -v "$PWD/target/gha-artifact:/output" \
            alpine:3.22 /bin/sh -ec '
              apk add --no-cache abuild openssl tar coreutils
              sh /work/scripts/build-ci-alpine-apk.sh \
                /work/target/gha-artifact/nuraloumi-ci /output/native-apk "$1"
            ' sh "$GITHUB_SHA"
          test -s target/gha-artifact/native-apk/CI-EPHEMERAL-KEY.rsa.pub
          test -s target/gha-artifact/native-apk/NURALOUMI-APK-SHA256SUMS.txt
          find target/gha-artifact/native-apk -name 'nuraloumi-*.apk' -type f -size +0c | grep -q .
      - name: Upload Alpine armv7 musl tarball, signed development APK and qualification evidence
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: nuraloumi-alpine322-armv7-musleabihf-${{ github.run_number }}-${{ github.sha }}
          path: |
            target/gha-artifact/nuraloumi-ci.tar
            target/gha-artifact/nuraloumi-ci/MANIFEST.txt
            target/gha-artifact/native-apk/**
            target/gha-artifact/SHA256SUMS.txt
            target/gha-artifact/BUILD-INFO.txt
            target/gha-artifact/ELF-AUDIT.txt
            target/gha-artifact/BUILD-LOG.txt
            target/gha-artifact/BINARY-LIST.txt
          if-no-files-found: error
          retention-days: 14

      - name: Keep package promotion pending outside an explicit release dispatch
        if: ${{ github.event_name != 'workflow_dispatch' }}
        shell: bash
        run: |
          echo 'PACKAGE_GATE=PENDING: supply exact same-commit qualified WPE runtime inputs through workflow_dispatch.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build-only non-deployable musl ELF bytes and source evidence
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: nuraloumi-musl-armv7-build-audit-${{ github.run_number }}-${{ github.sha }}
          path: |
            target/gha-artifact/BUILD-LOG.txt
            target/gha-artifact/BINARY-LIST.txt
            target/gha-artifact/ELF-AUDIT.txt
            target/gha-artifact/armv7-musl-elf/**
            target/gha-artifact/ARMV7-ELF-SHA256SUMS.txt
            target/gha-artifact/AUDIT-ONLY-NO-DEPLOYMENT.txt
          if-no-files-found: error
          retention-days: 14

      # The push artifact contains real ELF bytes but lacks private WPE/GPU
      # runtime dependencies and is explicitly forbidden for deployment. This
      # independent artifact is emitted only after an exact producer transfer.
      - name: Validate GPU producer selection
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          PRODUCER_RUN: ${{ inputs.gpu_producer_run_id }}
          PRODUCER_REV: ${{ inputs.gpu_producer_revision }}
          PRODUCER_SHA: ${{ inputs.gpu_archive_sha256 }}
        run: |
          set -euo pipefail
          # Bind optional dispatch inputs even when a caller supplied blanks.
          PRODUCER_REV="${PRODUCER_REV:-}"
          PRODUCER_SHA="${PRODUCER_SHA:-}"
          if [[ -z "$PRODUCER_RUN" ]]; then
            test -z "$PRODUCER_REV"
            test -z "$PRODUCER_SHA"
            exit 0
          fi
          [[ "$PRODUCER_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$PRODUCER_REV" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PRODUCER_SHA" =~ ^[0-9a-f]{64}$ ]]
          test -n '${{ vars.SL101_GPU_PRODUCER_REPOSITORY }}'
          test -n '${{ secrets.SL101_GPU_PRODUCER_READ_TOKEN }}'

      - name: Retrieve independently built GPU source artifact
        if: ${{ inputs.gpu_producer_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: sl101-gpu-video-bundle
          repository: ${{ vars.SL101_GPU_PRODUCER_REPOSITORY }}
          run-id: ${{ inputs.gpu_producer_run_id }}
          github-token: ${{ secrets.SL101_GPU_PRODUCER_READ_TOKEN }}
          path: target/gpu-producer-download

      - name: Verify archive digest, producer source and all ELF modules
        if: ${{ inputs.gpu_producer_run_id != '' }}
        shell: bash
        env:
          NURALOUMI_VIDEO_PRODUCER_REVISION: ${{ inputs.gpu_producer_revision }}
          NURALOUMI_VIDEO_ARCHIVE_SHA256: ${{ inputs.gpu_archive_sha256 }}
        run: |
          set -euo pipefail
          archive=target/gpu-producer-download/video-bundle.tar.gz
          test -f "$archive"
          printf '%s  %s\n' "$NURALOUMI_VIDEO_ARCHIVE_SHA256" "$archive" | sha256sum --check --status
          mkdir -p target/verified-gpu-video
          # Reject archive escape, links and other non-regular members before extraction.
          python3 -m tarfile -l "$archive"
          python3 scripts/extract_sl101_video_bundle.py "$archive" target/verified-gpu-video
          python3 scripts/verify_sl101_video_bundle.py target/verified-gpu-video \
            --target "$TARGET" \
            --producer-revision "$NURALOUMI_VIDEO_PRODUCER_REVISION" \
            --archive-sha256 "$NURALOUMI_VIDEO_ARCHIVE_SHA256"

      - name: Package and audit GPU-video variant
        if: ${{ inputs.gpu_producer_run_id != '' }}
        shell: bash
        env:
          NURALOUMI_BROWSER_RUNTIME_DIR: ${{ github.workspace }}/target/browser-producer-download
          NURALOUMI_BROWSER_PRODUCER_REVISION: ${{ github.sha }}
          NURALOUMI_VIDEO_PRODUCER_REVISION: ${{ inputs.gpu_producer_revision }}
          NURALOUMI_VIDEO_ARCHIVE_SHA256: ${{ inputs.gpu_archive_sha256 }}
          NURALOUMI_VIDEO_BUNDLE_SOURCE_VERIFIED: '1'
        run: |
          set -euo pipefail
          export NURALOUMI_VIDEO_BUNDLE_DIR="$PWD/target/verified-gpu-video"
          cargo xtask package --target "$TARGET" --out target/gha-artifact/nuraloumi-gpu-ci
          cargo xtask package-check --dir target/gha-artifact/nuraloumi-gpu-ci
          python3 scripts/verify_packaged_sl101_video.py target/gha-artifact/nuraloumi-gpu-ci.tar \
            --source-sha "$GITHUB_SHA" \
            --expected-version "$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')" \
            --producer-revision "$NURALOUMI_VIDEO_PRODUCER_REVISION" \
            --target "$TARGET"
          test "$(find target/gha-artifact/nuraloumi-gpu-ci/bin -name nuraloumi-player -type f | wc -l)" -eq 1
          test "$(find target/gha-artifact/nuraloumi-gpu-ci/bin -name nuraloumi-playerd -type f | wc -l)" -eq 1
          test -f target/gha-artifact/nuraloumi-gpu-ci/lib/nuraloumi/video/provenance.json
          (cd target/gha-artifact && sha256sum nuraloumi-gpu-ci.tar > GPU-SHA256SUMS.txt)

      - name: Sign combined browser and GPU-video Alpine APK
        if: ${{ inputs.gpu_producer_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD:/work:ro" \
            -v "$PWD/target/gha-artifact:/output" \
            alpine:3.22 /bin/sh -ec '
              apk add --no-cache abuild openssl tar coreutils
              sh /work/scripts/build-ci-alpine-apk.sh \
                /work/target/gha-artifact/nuraloumi-gpu-ci /output/native-gpu-apk "$1"
            ' sh "$GITHUB_SHA"
          test -s target/gha-artifact/native-gpu-apk/NURALOUMI-APK-SHA256SUMS.txt
          find target/gha-artifact/native-gpu-apk -name 'nuraloumi-*.apk' -type f -size +0c | grep -q .
          test -s target/gha-artifact/native-gpu-apk/CI-EPHEMERAL-KEY.rsa.pub

      - name: Upload verified GPU-video variant (device qualification pending)
        if: ${{ inputs.gpu_producer_run_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nuraloumi-gpu-source-verified-armv7-${{ github.run_number }}-${{ github.sha }}
          path: |
            target/gha-artifact/nuraloumi-gpu-ci.tar
            target/gha-artifact/nuraloumi-gpu-ci/MANIFEST.txt
            target/gha-artifact/native-gpu-apk/**
            target/gha-artifact/GPU-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
