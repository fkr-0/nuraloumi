name: NuraBrowser WPE ARMv7 musl candidate

on:
  workflow_dispatch:
    inputs:
      probe_only:
        description: 'Run a short native AArch32-on-Arm64 capability probe; skip the long WPE build'
        required: false
        type: boolean
        default: false
      media_enabled:
        description: 'Opt in to a fresh, UNQUALIFIED WPE GStreamer/video candidate (never resume old no-video build)'
        required: false
        type: boolean
        default: false
      bundle_source_run_id:
        description: 'Reuse exact successful native ARMv7 media producer run instead of recompiling WebKit'
        required: false
        type: string
        default: ''
      bundle_source_sha:
        description: 'Exact 40-hex source commit of the successful media producer'
        required: false
        type: string
        default: ''
      bundle_tar_sha256:
        description: 'Exact SHA-256 of its unqualified WPE candidate TAR'
        required: false
        type: string
        default: ''
      resume_run_id:
        description: 'Exact failed WPE producer run ID containing an unqualified build checkpoint'
        required: false
        type: string
      resume_archive_sha256:
        description: 'SHA256 of the exact build-state.tar.zst from that producer run'
        required: false
        type: string
  pull_request:
    paths:
      - .github/workflows/nurabrowser-wpe-musl-producer.yml
      - scripts/ci-fetch-nurabrowser-wpe-source.sh
      - scripts/ci-build-nurabrowser-wpe-musl.sh
      - scripts/ci-wpe-checkpoint.sh
      - components/nura-browser-engine/**
      - scripts/verify_nurabrowser_runtime.py
      - scripts/test_verify_nurabrowser_runtime.py
      - scripts/test_wpe_musl_producer_ci.py
      - scripts/ci-probe-armv7-native-compat.sh
      - scripts/test_wpe_arm_runner_ci.py
      - scripts/ci-bundle-nurabrowser-wpe-media-musl.sh
      - scripts/test_wpe_media_bundle_ci.py

permissions:
  contents: read
  actions: read

jobs:
  hosted-arm64-native-armv7-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_only }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect real ARMv7 process and compiler, without QEMU
        shell: bash
        run: |
          set -euo pipefail
          command -v readelf || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends binutils; }
          bash scripts/ci-probe-armv7-native-compat.sh target/native-armv7-probe
      - name: Preserve native execution proof or falsification
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hosted-arm64-native-armv7-probe-${{ github.run_id }}-${{ github.sha }}
          path: |
            target/native-armv7-probe/RESULT.txt
            target/native-armv7-probe/HOST-PROCESS-ELF.txt
            target/native-armv7-probe/TARGET-COMPILER.txt
            target/native-armv7-probe/TARGET-ELF.txt
            target/native-armv7-probe/TARGET-ATTRIBUTES.txt
          if-no-files-found: warn
          retention-days: 14

  native-armv7-musl-wpe-candidate:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.probe_only || inputs.bundle_source_run_id != '')) }}
    # This is a build candidate, not a regular APK, qualification, or deploy.
    # This Arm64 host runs real 32-bit ARMv7 userspace, as proven by /proc/PID/exe.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure fast host-side checkpoint compressor is available
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zstd; }
      - name: Fail closed if hosted Arm runner loses native AArch32 support
        shell: bash
        run: |
          set -euo pipefail
          command -v readelf || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends binutils; }
          bash scripts/ci-probe-armv7-native-compat.sh target/wpe-producer-native-preflight
      - name: Verify source pin and static runtime contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest scripts/test_verify_nurabrowser_runtime.py -v
          python3 -m unittest scripts/test_wpe_musl_producer_ci.py -v
          python3 -m unittest scripts/test_verify_nurabrowser_media_candidate.py -v
          sh scripts/ci-fetch-nurabrowser-wpe-source.sh target/wpe-source
      - name: Reject incomplete resume selection
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          RESUME_RUN: ${{ inputs.resume_run_id }}
          RESUME_SHA256: ${{ inputs.resume_archive_sha256 }}
          MEDIA_ENABLED: ${{ inputs.media_enabled && '1' || '0' }}
        run: |
          set -euo pipefail
          if [[ -n "$RESUME_RUN" && -z "$RESUME_SHA256" ]] || \
             [[ -z "$RESUME_RUN" && -n "$RESUME_SHA256" ]]; then
            echo 'Both WPE checkpoint run ID and SHA256 are required together' >&2
            exit 2
          fi
          if [[ "$MEDIA_ENABLED" = 1 && -n "$RESUME_RUN" ]]; then
            echo 'Media-enabled WPE requires a fresh build; do not resume the no-video Ninja tree' >&2
            exit 2
          fi
      - name: Validate exact same-commit resume provenance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.resume_run_id }}
          RESUME_SHA256: ${{ inputs.resume_archive_sha256 }}
        run: |
          set -euo pipefail
          [[ "$RESUME_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$RESUME_SHA256" =~ ^[0-9a-f]{64}$ ]]
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN" |
            python3 -c '
          import json, os, sys
          run = json.load(sys.stdin)
          assert run.get("path") == ".github/workflows/nurabrowser-wpe-musl-producer.yml"
          assert run.get("head_sha") == os.environ["GITHUB_SHA"]
          assert run.get("status") == "completed" and run.get("conclusion") == "failure"
          '
      - name: Download exact failed-run WPE checkpoint
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: nurabrowser-wpe-musl-checkpoint-${{ inputs.resume_run_id }}-${{ github.sha }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: target/wpe-resume-download
      - name: Verify archive digest and restore resumable Ninja state
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '' }}
        shell: bash
        env:
          RESUME_SHA256: ${{ inputs.resume_archive_sha256 }}
        run: |
          set -euo pipefail
          bash scripts/ci-wpe-checkpoint.sh restore \
            target/wpe-resume-download/build-state.tar.zst \
            target/wpe-producer-candidate "$RESUME_SHA256" "$GITHUB_SHA"
      - name: Build native Alpine 3.22 ARMv7 candidate in isolated container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/wpe-producer-candidate
          # Stop early enough to archive a multi-GB Ninja tree on the Arm64 host
          # and upload it BEFORE GitHub's hard six-hour cancellation.
          set +e
          cidfile="$PWD/target/wpe-producer-candidate/Docker-CID.txt"
          timeout --signal=TERM --kill-after=120s 270m \
            docker run --rm --cidfile "$cidfile" --platform linux/arm/v7 \
              -e CI_SOURCE_SHA="$GITHUB_SHA" \
              -e CI_WPE_RESUME="${{ inputs.resume_run_id != '' && '1' || '0' }}" \
              -e CI_WPE_MEDIA="${{ github.event_name == 'workflow_dispatch' && inputs.media_enabled && '1' || '0' }}" \
              -v "$PWD:/work:ro" \
              -v "$PWD/target/wpe-producer-candidate:/out" \
              alpine:3.22 /bin/sh /work/scripts/ci-build-nurabrowser-wpe-musl.sh \
            2>&1 | tee target/wpe-producer-candidate/BUILD-LOG.txt
          statuses=("${PIPESTATUS[@]}")
          builder_rc=${statuses[0]}
          log_rc=${statuses[1]}
          # Ensure no orphan ARMv7 container can mutate the Ninja tree while
          # the host packs its checkpoint. The ID is created by this job.
          if test -s "$cidfile"; then
            docker rm --force "$(cat "$cidfile")" >/dev/null 2>&1 || true
          fi
          set -e
          printf 'source_sha=%s\nbuilder_exit=%s\nlog_exit=%s\nqualification=UNQUALIFIED\n' \
            "$GITHUB_SHA" "$builder_rc" "$log_rc" > target/wpe-producer-candidate/BUILD-STATUS.txt
          if test "$builder_rc" -ne 0 || test "$log_rc" -ne 0; then
            echo "WPE ARMv7/musl builder or diagnostic log failed: builder=$builder_rc tee=$log_rc" >&2
            test "$builder_rc" -eq 0 || exit "$builder_rc"
            exit "$log_rc"
          fi
          test -s target/wpe-producer-candidate/nurabrowser-wpe-musl-candidate.tar
          grep -Fx 'runtime_qualification=UNQUALIFIED' \
            target/wpe-producer-candidate/CANDIDATE-ONLY.txt
          test ! -e target/wpe-producer-candidate/stage/usr/libexec/nuraloumi/browser/runtime.json
      - name: Retain WPE musl Ninja diagnostics on failure or timeout
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nurabrowser-wpe-musl-build-log-${{ github.run_id }}-${{ github.sha }}
          path: |
            target/wpe-producer-candidate/BUILD-LOG.txt
            target/wpe-producer-candidate/BUILD-STATUS.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Archive the unqualified Ninja state after a bounded failure
        id: checkpoint
        if: ${{ failure() && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          if test -s target/wpe-producer-candidate/BUILD-PROVENANCE.txt && \
             test -s target/wpe-producer-candidate/build/webkit/build.ninja; then
            mkdir -p target/wpe-producer-checkpoint
            bash scripts/ci-wpe-checkpoint.sh create \
              target/wpe-producer-candidate target/wpe-producer-checkpoint/build-state.tar.zst
            printf 'ready=1\n' >> "$GITHUB_OUTPUT"
          else
            echo 'No configured Ninja graph available for safe checkpointing'
          fi
      - name: Upload resumable checkpoint (still unqualified)
        if: ${{ always() && !cancelled() && steps.checkpoint.outputs.ready == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: nurabrowser-wpe-musl-checkpoint-${{ github.run_id }}-${{ github.sha }}
          path: |
            target/wpe-producer-checkpoint/build-state.tar.zst
            target/wpe-producer-checkpoint/build-state.tar.zst.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload unqualified build evidence only
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: nurabrowser-wpe-musl-unqualified-${{ github.sha }}
          path: |
            target/wpe-producer-candidate/nurabrowser-wpe-musl-candidate.tar
            target/wpe-producer-candidate/CANDIDATE-ONLY.txt
            target/wpe-producer-candidate/SHA256SUMS.txt
            target/wpe-producer-candidate/STAGED-SHA256SUMS.txt
            target/wpe-producer-candidate/ALPINE-PACKAGES.txt
          if-no-files-found: error
          retention-days: 7

  native-armv7-musl-wpe-media-bundle:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_source_run_id != '' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate pinned source run before artifact access
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.bundle_source_run_id }}
          SOURCE_SHA: ${{ inputs.bundle_source_sha }}
          SOURCE_TAR_SHA: ${{ inputs.bundle_tar_sha256 }}
          PROBE_ONLY: ${{ inputs.probe_only && '1' || '0' }}
          MEDIA_ENABLED: ${{ inputs.media_enabled && '1' || '0' }}
        run: |
          set -euo pipefail
          test "$PROBE_ONLY" = 0 && test "$MEDIA_ENABLED" = 0
          [[ "$SOURCE_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_TAR_SHA" =~ ^[0-9a-f]{64}$ ]]
          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" |
            python3 -c '
          import json, os, sys
          r = json.load(sys.stdin)
          assert r.get("path") == ".github/workflows/nurabrowser-wpe-musl-producer.yml"
          assert r.get("head_sha") == os.environ["SOURCE_SHA"]
          assert r.get("event") == "workflow_dispatch"
          assert r.get("status") == "completed" and r.get("conclusion") == "success"
          '
      - name: Retrieve immutable producer candidate from exact source run
        uses: actions/download-artifact@v4
        with:
          name: nurabrowser-wpe-musl-unqualified-${{ inputs.bundle_source_sha }}
          run-id: ${{ inputs.bundle_source_run_id }}
          github-token: ${{ github.token }}
          path: target/media-input
      - name: Retrieve independent producer CMake evidence
        uses: actions/download-artifact@v4
        with:
          name: nurabrowser-wpe-musl-build-log-${{ inputs.bundle_source_run_id }}-${{ inputs.bundle_source_sha }}
          run-id: ${{ inputs.bundle_source_run_id }}
          github-token: ${{ github.token }}
          path: target/media-producer-log
      - name: Verify SHA, media configuration and safe TAR paths
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.bundle_source_sha }}
          SOURCE_TAR_SHA: ${{ inputs.bundle_tar_sha256 }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$SOURCE_TAR_SHA" \
            target/media-input/nurabrowser-wpe-musl-candidate.tar | sha256sum -c -
          grep -Fx "source_sha=$SOURCE_SHA" target/media-input/CANDIDATE-ONLY.txt
          grep -Fx 'media_build_requested=1' target/media-input/CANDIDATE-ONLY.txt
          grep -Fx 'runtime_qualification=UNQUALIFIED' target/media-input/CANDIDATE-ONLY.txt
          grep -E '^--  ENABLE_VIDEO[ .]+ON$' target/media-producer-log/BUILD-LOG.txt
          grep -E '^--  ENABLE_WEB_AUDIO[ .]+ON$' target/media-producer-log/BUILD-LOG.txt
          grep -E '^--  USE_GSTREAMER[ .]+ON$' target/media-producer-log/BUILD-LOG.txt
          python3 - <<'PY'
          from pathlib import PurePosixPath
          import posixpath
          import tarfile
          with tarfile.open("target/media-input/nurabrowser-wpe-musl-candidate.tar") as t:
              for m in t:
                  p = PurePosixPath(m.name)
                  assert not p.is_absolute() and ".." not in p.parts, m.name
                  if m.issym() or m.islnk():
                      dest = posixpath.normpath(posixpath.join(posixpath.dirname(m.name), m.linkname))
                      assert not dest.startswith("../") and not dest.startswith("/"), m.name
          PY
      - name: Prove native ARMv7 execution and bundle private media runtime
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.bundle_source_sha }}
          SOURCE_RUN: ${{ inputs.bundle_source_run_id }}
          SOURCE_TAR_SHA: ${{ inputs.bundle_tar_sha256 }}
        run: |
          set -euo pipefail
          bash scripts/ci-probe-armv7-native-compat.sh target/media-native-probe
          python3 -m unittest scripts/test_wpe_media_bundle_ci.py -v
          mkdir -p target/media-bundle
          timeout --signal=TERM --kill-after=30s 35m \
            docker run --rm --platform linux/arm/v7 \
              -e CI_BUNDLE_SOURCE_SHA="$SOURCE_SHA" \
              -e CI_BUNDLE_RUN_ID="$SOURCE_RUN" \
              -e CI_BUNDLE_TAR_SHA256="$SOURCE_TAR_SHA" \
              -v "$PWD:/work:ro" \
              -v "$PWD/target/media-input:/input:ro" \
              -v "$PWD/target/media-bundle:/out" \
              alpine:3.22 /bin/sh /work/scripts/ci-bundle-nurabrowser-wpe-media-musl.sh \
              2>&1 | tee target/media-bundle/BUILD-LOG.txt
          grep -Fx 'MEDIA_RUNTIME_BUNDLE=HOST_PREFLIGHT_PASS_DEVICE_NOT_RUN' \
            target/media-bundle/BUILD-LOG.txt
          test ! -e target/media-bundle/runtime-root/usr/libexec/nuraloumi/browser/runtime.json
          grep -Fx 'runtime_qualification=UNQUALIFIED' target/media-bundle/BUNDLE-PROVENANCE.txt
          command -v zstd || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zstd; }
          tar -C target/media-bundle -cf - runtime-root | zstd -T0 -6 \
            -o target/media-bundle/runtime-root.tar.zst
          sha256sum target/media-bundle/runtime-root.tar.zst \
            > target/media-bundle/runtime-root.tar.zst.sha256
      - name: Upload pinned UNQUALIFIED runtime bundle and all factory evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nurabrowser-wpe-media-runtime-unqualified-${{ github.run_id }}
          path: |
            target/media-bundle/runtime-root.tar.zst
            target/media-bundle/runtime-root.tar.zst.sha256
            target/media-bundle/BUNDLE-PROVENANCE.txt
            target/media-bundle/ALPINE-RUNTIME-PACKAGES.txt
            target/media-bundle/FACTORIES.tsv
            target/media-bundle/RUNTIME-SHA256SUMS.txt
            target/media-bundle/probe/ELF-NEEDED.txt
            target/media-bundle/BUILD-LOG.txt
            target/media-native-probe/RESULT.txt
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
